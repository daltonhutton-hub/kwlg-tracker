<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

  --mon:#C8102E;--mon-light:#FDE8EB;--mon-border:#f5b8c0;
  --wed:#B8860B;--wed-light:#FFFDE7;--wed-border:#ffe082;
  --fri:#2E7D32;--fri-light:#E8F5E9;--fri-border:#a5d6a7;
  --gray:#f5f5f5;--gray2:#e0e0e0;--gray3:#9e9e9e;
  --text:#111;--text2:#555;
  --status-ontrack:#1b5e20;--status-ontrack-bg:#e8f5e9;
  --status-checkin:#e65100;--status-checkin-bg:#fff3e0;
  --status-quiet:#bf360c;--status-quiet-bg:#fbe9e7;
  --status-deadline:#c62828;--status-deadline-bg:#ffebee;
  --status-never:#4a148c;--status-never-bg:#f3e5f5;
  --status-expired:#424242;--status-expired-bg:#f5f5f5;
}
body{font-family:'Inter',sans-serif;background:#f4f4f4;color:var(--text);min-height:100vh}

/* ── HEADER ── */
.header{background:var(--dark);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.header-brand{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:.06em}
.header-brand span{color:var(--red)}
.header-date{font-size:12px;color:#aaa;letter-spacing:.05em}
.header-actions{display:flex;gap:8px}
.btn{padding:7px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:#a50d24}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-sm{padding:5px 12px;font-size:12px}

/* ── SUMMARY BAR ── */
.summary{background:#fff;border-bottom:1px solid var(--gray2);padding:12px 24px;display:flex;gap:24px;align-items:center;overflow-x:auto}
.summary-card{display:flex;align-items:center;gap:8px;white-space:nowrap}
.summary-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.summary-label{font-size:12px;color:var(--text2)}
.summary-num{font-size:14px;font-weight:700;color:var(--text)}
.summary-divider{width:1px;height:20px;background:var(--gray2);flex-shrink:0}

/* ── TABS ── */
.tabs{background:#fff;border-bottom:2px solid var(--gray2);padding:0 24px;display:flex;gap:0}
.tab{padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;color:var(--text2);display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab.mon.active{color:var(--mon);border-bottom-color:var(--mon)}
.tab.wed.active{color:var(--wed);border-bottom-color:var(--wed)}
.tab.fri.active{color:var(--fri);border-bottom-color:var(--fri)}
.tab.all.active{color:var(--dark);border-bottom-color:var(--dark)}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;background:var(--gray);color:var(--text2)}
.tab.active .tab-count{background:var(--red);color:#fff}

/* ── CONTENT ── */
.content{padding:20px 24px;max-width:1400px;margin:0 auto}
.section-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px;padding:8px 14px;border-radius:6px;display:flex;align-items:center;gap:8px}
.section-label.mon{color:var(--mon);background:var(--mon-light);border:1px solid var(--mon-border)}
.section-label.wed{color:var(--wed);background:var(--wed-light);border:1px solid var(--wed-border)}
.section-label.fri{color:var(--fri);background:var(--fri-light);border:1px solid var(--fri-border)}
.section-count{font-weight:400;opacity:.7}

/* ── STUDENT CARDS ── */
.cards{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.card{background:#fff;border-radius:10px;border:1px solid var(--gray2);overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.1)}
.card-header{display:grid;grid-template-columns:4px 1fr auto;align-items:center;gap:0;cursor:pointer}
.card-accent{width:4px;height:100%;min-height:56px;flex-shrink:0}
.card-accent.mon{background:var(--mon)}
.card-accent.wed{background:var(--wed)}
.card-accent.fri{background:var(--fri)}
.card-main{padding:12px 16px;display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.card-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-phone{font-size:12px;color:var(--text2);white-space:nowrap}
.card-meta{display:flex;align-items:center;gap:12px;flex-shrink:0}
.card-stat{text-align:center}
.card-stat-num{font-size:13px;font-weight:700;line-height:1}
.card-stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.card-stat-num.warn{color:var(--red)}
.card-actions{padding:12px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.status-badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.status-ON.TRACK{background:var(--status-ontrack-bg);color:var(--status-ontrack)}
.status-CHECK.IN{background:var(--status-checkin-bg);color:var(--status-checkin)}
.status-GONE.QUIET{background:var(--status-quiet-bg);color:var(--status-quiet)}
.status-DEADLINE.SOON{background:var(--status-deadline-bg);color:var(--status-deadline)}
.status-NEVER.LOGGED.IN{background:var(--status-never-bg);color:var(--status-never)}
.status-EXPIRED{background:var(--status-expired-bg);color:var(--status-expired)}
.chevron{color:var(--gray3);font-size:16px;transition:transform .2s;flex-shrink:0;padding:0 8px}
.card.open .chevron{transform:rotate(180deg)}

/* ── CARD BODY ── */
.card-body{display:none;border-top:1px solid var(--gray2);padding:16px}
.card.open .card-body{display:block}
.card-body-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-group{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3)}
.field-value{font-size:13px;color:var(--text)}
.field input,.field textarea{border:1px solid var(--gray2);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .15s;width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--red)}
.field textarea{resize:vertical;min-height:120px;line-height:1.5}
.notes-hint{font-size:11px;color:var(--gray3);margin-top:4px}
.save-row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--gray2)}
.save-confirm{font-size:12px;color:var(--fri);font-weight:600;display:none;align-items:center;gap:4px}
.save-confirm.show{display:flex}

/* ── ADD STUDENT MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--gray2);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray3);line-height:1}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray2);display:flex;justify-content:flex-end;gap:8px}

/* ── SEARCH ── */
.search-bar{padding:12px 24px;background:#fff;border-bottom:1px solid var(--gray2)}
.search-input{width:100%;max-width:400px;padding:8px 14px;border:1px solid var(--gray2);border-radius:8px;font-size:13px;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--red)}

/* ── EMPTY ── */
.empty{text-align:center;padding:48px 24px;color:var(--gray3)}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty-text{font-size:14px}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .header{padding:0 14px}
  .content{padding:14px}
  .card-body-grid{grid-template-columns:1fr}
  .card-stat:nth-child(n+3){display:none}
  .summary{gap:14px}
}
</style>
</head>

    const saved = localStorage.getItem('kwlg_students_v3');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return SEED.map(s => ({...s}));
}

function saveStudents(students) {
  try { localStorage.setItem('kwlg_students_v3', JSON.stringify(students)); } catch(e) {}
}

let students = loadStudents();
let activeTab = 'mon';
let searchOpen = false;

// ── DATE UTILS ────────────────────────────────────────────────────────────────
function parseDate(str) {
  if (!str || str.trim() === '') return null;
  const s = str.trim();
  // Try MM/DD/YYYY
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  // Try YYYY-MM-DD (from date input)
  const m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m2) return new Date(+m2[1], +m2[2]-1, +m2[3]);
  return null;
}

function today() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function daysLeft(endStr) {
  const end = parseDate(endStr);
  if (!end) return null;
  return Math.round((end - today()) / 86400000);
}

function daysSinceLogin(loginStr) {
  const d = parseDate(loginStr);
  if (!d) return null;
  return Math.round((today() - d) / 86400000);
}

function status(s) {
  const dl = daysLeft(s.end);
  const dsl = daysSinceLogin(s.lastLogin);
  if (dl === null) return 'UNKNOWN';
  if (dl < 0) return 'EXPIRED';
  if (dl <= 30) return 'DEADLINE SOON';
  if (!s.lastLogin || s.lastLogin.trim() === '') return 'NEVER LOGGED IN';
  if (dsl >= 14) return 'GONE QUIET';
  if (dsl >= 7) return 'CHECK IN';
  return 'ON TRACK';
}

function dayGroup(s) {
  const dl = daysLeft(s.end);
  if (dl === null) return 'fri';
  if (dl <= 30) return 'mon';   // expired + <=30 days
  if (dl <= 60) return 'wed';   // 31-60 days
  return 'fri';                  // 61+
}

function formatDate(str) {
  const d = parseDate(str);
  if (!d) return '—';
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function toInputDate(str) {
  const d = parseDate(str);
  if (!d) return '';
  return d.toISOString().split('T')[0];
}

function fromInputDate(str) {
  if (!str) return '';
  const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return str;
  return `${m[2]}/${m[3]}/${m[1]}`;
}

// ── STATUS HELPERS ────────────────────────────────────────────────────────────
const STATUS_LABEL = {
  'ON TRACK': 'On Track',
  'CHECK IN': 'Check In',
  'GONE QUIET': 'Gone Quiet',
  'DEADLINE SOON': 'Deadline Soon',
  'NEVER LOGGED IN': 'Never Logged In',
  'EXPIRED': 'Expired',
  'UNKNOWN': 'Unknown',
};

const STATUS_CLASS = {
  'ON TRACK': 'status-ON.TRACK',
  'CHECK IN': 'status-CHECK.IN',
  'GONE QUIET': 'status-GONE.QUIET',
  'DEADLINE SOON': 'status-DEADLINE.SOON',
  'NEVER LOGGED IN': 'status-NEVER.LOGGED.IN',
  'EXPIRED': 'status-EXPIRED',
  'UNKNOWN': 'status-EXPIRED',
};

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll() {
  renderSummary();
  renderTabs();
  renderContent();
}

function renderSummary() {
  const counts = {};
  students.forEach(s => { const st = status(s); counts[st] = (counts[st]||0)+1; });
  const items = [
    {label:'Expired', key:'EXPIRED', color:'#666'},
    {label:'Deadline Soon', key:'DEADLINE SOON', color:'#c62828'},
    {label:'Gone Quiet', key:'GONE QUIET', color:'#bf360c'},
    {label:'Check In', key:'CHECK IN', color:'#e65100'},
    {label:'On Track', key:'ON TRACK', color:'#2e7d32'},
    {label:'Never Logged In', key:'NEVER LOGGED IN', color:'#4a148c'},
  ];
  const bar = document.getElementById('summaryBar');
  bar.innerHTML = items.map((item,i) => `
    ${i>0?'<div class="summary-divider"></div>':''}
    <div class="summary-card">
      <div class="summary-dot" style="background:${item.color}"></div>
      <div class="summary-label">${item.label}</div>
      <div class="summary-num">${counts[item.key]||0}</div>
    </div>
  `).join('');
}

function renderTabs() {
  const grp = {mon:0,wed:0,fri:0};
  const search = document.getElementById('searchInput');
  const q = search ? search.value.toLowerCase() : '';
  students.filter(s => !q || matchSearch(s,q)).forEach(s => { grp[dayGroup(s)]++; });
  const total = grp.mon+grp.wed+grp.fri;

  const tabs = [
    {id:'mon',label:'Monday',cls:'mon',count:grp.mon},
    {id:'wed',label:'Wednesday',cls:'wed',count:grp.wed},
    {id:'fri',label:'Friday',cls:'fri',count:grp.fri},
    {id:'all',label:'All Students',cls:'all',count:total},
  ];
  document.getElementById('tabBar').innerHTML = tabs.map(t => `
    <div class="tab ${t.cls} ${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${t.label}
      <span class="tab-count">${t.count}</span>
    </div>
  `).join('');
}

function setTab(id) {
  activeTab = id;
  renderAll();
}

function matchSearch(s, q) {
  return s.name.toLowerCase().includes(q) ||
         (s.phone||'').includes(q) ||
         (s.email||'').toLowerCase().includes(q);
}

function renderContent() {
  const search = document.getElementById('searchInput');
  const q = search ? search.value.toLowerCase() : '';

  let filtered = students.filter(s => !q || matchSearch(s,q));

  const sections = activeTab === 'all'
    ? [{id:'mon',label:'MONDAY',sub:'Expired + 30 days or fewer remaining',cls:'mon'},
       {id:'wed',label:'WEDNESDAY',sub:'31 to 60 days remaining',cls:'wed'},
       {id:'fri',label:'FRIDAY',sub:'61+ days remaining  ·  Add new students here',cls:'fri'}]
    : [{id:activeTab,
        label:activeTab==='mon'?'MONDAY':activeTab==='wed'?'WEDNESDAY':'FRIDAY',
        sub:activeTab==='mon'?'Expired + 30 days or fewer remaining':
            activeTab==='wed'?'31 to 60 days remaining':
            '61+ days remaining  ·  Add new students here',
        cls:activeTab}];

  const statusOrder = ['EXPIRED','DEADLINE SOON','NEVER LOGGED IN','GONE QUIET','CHECK IN','ON TRACK','UNKNOWN'];

  let html = '';
  sections.forEach(sec => {
    const grpStudents = filtered.filter(s => dayGroup(s) === sec.id)
      .sort((a,b) => statusOrder.indexOf(status(a)) - statusOrder.indexOf(status(b)));
    if (grpStudents.length === 0 && activeTab !== 'all') {
      html += `<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">No students in this group right now.</div></div>`;
      return;
    }
    if (grpStudents.length === 0) return;
    html += `
      <div class="section-label ${sec.cls}">
        <strong>${sec.label}</strong>
        <span class="section-count">— ${sec.sub} · ${grpStudents.length} student${grpStudents.length!==1?'s':''}</span>
      </div>
      <div class="cards">
        ${grpStudents.map(s => renderCard(s, sec.cls)).join('')}
      </div>
    `;
  });
  document.getElementById('content').innerHTML = html || `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No students match your search.</div></div>`;
}

function renderCard(s, grpCls) {
  const st = status(s);
  const dl = daysLeft(s.end);
  const dsl = daysSinceLogin(s.lastLogin);
  const idx = students.indexOf(s);
  const stClass = STATUS_CLASS[st] || 'status-EXPIRED';

  return `
    <div class="card" id="card-${idx}">
      <div class="card-header" onclick="toggleCard(${idx})">
        <div class="card-accent ${grpCls}"></div>
        <div class="card-main">
          <div>
            <div class="card-name">${s.name}</div>
            <div class="card-phone">${s.phone||'No phone'}</div>
          </div>
          <div class="card-meta">
            <div class="card-stat">
              <div class="card-stat-num ${dl!==null&&dl<=30?'warn':''}">${dl===null?'—':dl<0?Math.abs(dl)+' over':dl}</div>
              <div class="card-stat-label">${dl!==null&&dl<0?'Days Over':'Days Left'}</div>
            </div>
            <div class="card-stat">
              <div class="card-stat-num ${dsl!==null&&dsl>=14?'warn':''}">${dsl===null?'Never':dsl}</div>
              <div class="card-stat-label">Days Since Login</div>
            </div>
            <div class="card-stat">
              <div class="card-stat-num">${s.seatHrs||0}</div>
              <div class="card-stat-label">Seat Hrs</div>
            </div>
          </div>
        </div>
        <div class="card-actions">
          <span class="status-badge ${stClass}">${STATUS_LABEL[st]||st}</span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-body-grid">
          <div class="field-group">
            <div class="field"><div class="field-label">Phone</div><input id="f-${idx}-phone" value="${s.phone||''}"/></div>
            <div class="field"><div class="field-label">Email</div><input id="f-${idx}-email" value="${s.email||''}"/></div>
            <div class="field"><div class="field-label">Last Login (from Kaplan)</div><input id="f-${idx}-login" type="date" value="${toInputDate(s.lastLogin)}"/></div>
            <div class="field"><div class="field-label">Seat Hours (from Kaplan)</div><input id="f-${idx}-seat" type="number" step="0.1" value="${s.seatHrs||0}"/></div>
            <div class="field"><div class="field-label">Start Date</div><input id="f-${idx}-start" type="date" value="${toInputDate(s.start)}"/></div>
            <div class="field"><div class="field-label">End Date</div><input id="f-${idx}-end" type="date" value="${toInputDate(s.end)}"/></div>
            <div class="field"><div class="field-label">Referred By</div><input id="f-${idx}-ref" value="${s.referredBy||''}"/></div>
          </div>
          <div class="field-group">
            <div class="field">
              <div class="field-label">Notes (newest at top)</div>
              <textarea id="f-${idx}-notes" rows="10">${s.notes||''}</textarea>
              <div class="notes-hint">Format: 7/29 Called, she said she's on chapter 4 and feeling good.</div>
            </div>
          </div>
        </div>
        <div class="save-row">
          <div class="save-confirm" id="confirm-${idx}">✓ Saved</div>
          <button class="btn btn-ghost btn-sm" onclick="toggleCard(${idx})">Close</button>
          <button class="btn btn-primary btn-sm" onclick="saveCard(${idx})">Save Changes</button>
        </div>
      </div>
    </div>
  `;
}

function toggleCard(idx) {
  const card = document.getElementById(`card-${idx}`);
  card.classList.toggle('open');
}

function saveCard(idx) {
  const get = id => document.getElementById(id);
  students[idx].phone    = get(`f-${idx}-phone`).value.trim();
  students[idx].email    = get(`f-${idx}-email`).value.trim();
  students[idx].lastLogin= fromInputDate(get(`f-${idx}-login`).value);
  students[idx].seatHrs  = parseFloat(get(`f-${idx}-seat`).value)||0;
  students[idx].start    = fromInputDate(get(`f-${idx}-start`).value);
  students[idx].end      = fromInputDate(get(`f-${idx}-end`).value);
  students[idx].referredBy = get(`f-${idx}-ref`).value.trim();
  students[idx].notes    = get(`f-${idx}-notes`).value;
  saveStudents(students);

  const confirm = document.getElementById(`confirm-${idx}`);
  confirm.classList.add('show');
  setTimeout(() => confirm.classList.remove('show'), 2000);

  // Re-render to update status/group without closing card
  renderSummary();
  renderTabs();
}

// ── ADD STUDENT ───────────────────────────────────────────────────────────────
function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

document.getElementById('new-start').addEventListener('change', function() {
  if (!this.value) return;
  const d = new Date(this.value + 'T00:00:00');
  d.setMonth(d.getMonth() + 6);
  document.getElementById('new-end').value = d.toISOString().split('T')[0];
});

function saveNewStudent() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { alert('Please enter a name.'); return; }
  const newStudent = {
    name,
    phone:      document.getElementById('new-phone').value.trim(),
    email:      document.getElementById('new-email').value.trim(),
    start:      fromInputDate(document.getElementById('new-start').value),
    end:        fromInputDate(document.getElementById('new-end').value),
    lastLogin:  '',
    seatHrs:    0,
    referredBy: document.getElementById('new-ref').value.trim(),
    notes:      document.getElementById('new-note').value.trim(),
  };
  students.push(newStudent);
  saveStudents(students);
  closeAddModal();
  ['new-name','new-phone','new-email','new-start','new-end','new-ref','new-note']
    .forEach(id => document.getElementById(id).value = '');
  activeTab = 'fri';
  renderAll();
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function openSearch() {
  searchOpen = !searchOpen;
  const bar = document.getElementById('searchBar');
  bar.style.display = searchOpen ? 'block' : 'none';
  if (searchOpen) document.getElementById('searchInput').focus();
  else { document.getElementById('searchInput').value = ''; renderAll(); }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('headerDate').textContent =
  new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

renderAll();
</script>
