<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KWLG School Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C8102E;--dark:#111;--charcoal:#1a1a1a;
  --mon:#C8102E;--mon-light:#FDE8EB;--mon-border:#f5b8c0;
  --wed:#B8860B;--wed-light:#FFFDE7;--wed-border:#ffe082;
  --fri:#2E7D32;--fri-light:#E8F5E9;--fri-border:#a5d6a7;
  --gray:#f5f5f5;--gray2:#e0e0e0;--gray3:#9e9e9e;--text:#111;--text2:#555;
  --s-ontrack:#1b5e20;--s-ontrack-bg:#e8f5e9;
  --s-checkin:#e65100;--s-checkin-bg:#fff3e0;
  --s-quiet:#bf360c;--s-quiet-bg:#fbe9e7;
  --s-deadline:#c62828;--s-deadline-bg:#ffebee;
  --s-never:#4a148c;--s-never-bg:#f3e5f5;
  --s-expired:#424242;--s-expired-bg:#f5f5f5;
}
body{font-family:'Inter',sans-serif;background:#f4f4f4;color:var(--text);min-height:100vh}
.header{background:var(--dark);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.header-brand{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:.06em}
.header-brand span{color:var(--red)}
.header-date{font-size:12px;color:#aaa;letter-spacing:.05em}
.header-actions{display:flex;gap:8px}
.btn{padding:7px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a50d24}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15)}.btn-ghost:hover{background:rgba(255,255,255,.15)}
.btn-dark{background:var(--dark);color:#fff;border:1px solid #333}.btn-dark:hover{background:#222}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-green{background:#2e7d32;color:#fff}.btn-green:hover{background:#1b5e20}
.summary{background:#fff;border-bottom:1px solid var(--gray2);padding:10px 24px;display:flex;gap:20px;align-items:center;overflow-x:auto;flex-wrap:wrap}
.summary-card{display:flex;align-items:center;gap:7px;white-space:nowrap}
.summary-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.summary-label{font-size:11px;color:var(--text2)}
.summary-num{font-size:13px;font-weight:700}
.summary-divider{width:1px;height:18px;background:var(--gray2);flex-shrink:0}
.tabs{background:#fff;border-bottom:2px solid var(--gray2);padding:0 24px;display:flex;gap:0;overflow-x:auto}
.tab{padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;color:var(--text2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab.mon.active{color:var(--mon);border-bottom-color:var(--mon)}
.tab.wed.active{color:var(--wed);border-bottom-color:var(--wed)}
.tab.fri.active{color:var(--fri);border-bottom-color:var(--fri)}
.tab.ref.active{color:#6a1b9a;border-bottom-color:#6a1b9a}
.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;background:var(--gray);color:var(--text2)}
.tab.active .tab-count{background:var(--red);color:#fff}
.search-bar{padding:10px 24px;background:#fff;border-bottom:1px solid var(--gray2)}
.search-input{width:100%;max-width:400px;padding:7px 12px;border:1px solid var(--gray2);border-radius:7px;font-size:13px;font-family:inherit}
.search-input:focus{outline:none;border-color:var(--red)}
.content{padding:18px 24px;max-width:1400px;margin:0 auto}
.section-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;padding:7px 12px;border-radius:6px;display:flex;align-items:center;gap:8px}
.section-label.mon{color:var(--mon);background:var(--mon-light);border:1px solid var(--mon-border)}
.section-label.wed{color:var(--wed);background:var(--wed-light);border:1px solid var(--wed-border)}
.section-label.fri{color:var(--fri);background:var(--fri-light);border:1px solid var(--fri-border)}
.section-count{font-weight:400;opacity:.7}
.cards{display:flex;flex-direction:column;gap:7px;margin-bottom:24px}
.card{background:#fff;border-radius:10px;border:1px solid var(--gray2);overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.09)}
.card-header{display:grid;grid-template-columns:4px 1fr auto;cursor:pointer}
.card-accent{width:4px;min-height:54px}
.card-accent.mon{background:var(--mon)}.card-accent.wed{background:var(--wed)}.card-accent.fri{background:var(--fri)}
.card-main{padding:11px 14px;display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.card-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-phone{font-size:12px;color:var(--text2)}
.card-ref-badge{display:inline-flex;align-items:center;gap:4px;background:#f3e5f5;color:#6a1b9a;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-top:3px}
.card-meta{display:flex;align-items:center;gap:14px;flex-shrink:0}
.card-stat{text-align:center}
.card-stat-num{font-size:13px;font-weight:700;line-height:1}
.card-stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.card-stat-num.warn{color:var(--red)}
.card-actions{padding:11px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.status-badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.s-ON{background:var(--s-ontrack-bg);color:var(--s-ontrack)}
.s-CHECK{background:var(--s-checkin-bg);color:var(--s-checkin)}
.s-GONE{background:var(--s-quiet-bg);color:var(--s-quiet)}
.s-DEADLINE{background:var(--s-deadline-bg);color:var(--s-deadline)}
.s-NEVER{background:var(--s-never-bg);color:var(--s-never)}
.s-EXPIRED{background:var(--s-expired-bg);color:var(--s-expired)}
.chevron{color:var(--gray3);font-size:15px;transition:transform .2s;padding:0 6px}
.card.open .chevron{transform:rotate(180deg)}
.card-body{display:none;border-top:1px solid var(--gray2);padding:16px}
.card.open .card-body{display:block}
.card-body-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-group{display:flex;flex-direction:column;gap:11px}
.field{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray3)}
.field input,.field textarea,.field select{border:1px solid var(--gray2);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;transition:border-color .15s;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--red)}
.field textarea{resize:vertical;min-height:110px;line-height:1.5}
.notes-hint{font-size:11px;color:var(--gray3);margin-top:3px}
.save-row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray2)}
.save-confirm{font-size:12px;color:#2e7d32;font-weight:600;display:none;align-items:center;gap:4px}
.save-confirm.show{display:flex}
/* AUTOCOMPLETE */
.autocomplete-wrap{position:relative}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--gray2);border-radius:6px;z-index:50;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none}
.autocomplete-list.open{display:block}
.autocomplete-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--gray2)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover{background:var(--gray)}
.autocomplete-item .ac-email{font-size:11px;color:var(--gray3);margin-top:2px}
/* REFERRAL TAB */
.ref-section{margin-bottom:28px}
.ref-agent-card{background:#fff;border-radius:10px;border:1px solid var(--gray2);margin-bottom:8px;overflow:hidden}
.ref-agent-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.ref-agent-name{font-weight:700;font-size:15px}
.ref-agent-email{font-size:12px;color:var(--text2)}
.ref-agent-count{background:#f3e5f5;color:#6a1b9a;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px}
.ref-agent-body{display:none;border-top:1px solid var(--gray2);padding:12px 16px}
.ref-agent-card.open .ref-agent-body{display:block}
.ref-agent-card.open .chevron{transform:rotate(180deg)}
.ref-student-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray)}
.ref-student-row:last-child{border-bottom:none}
.ref-student-name{font-weight:600;font-size:13px}
.ref-student-meta{font-size:12px;color:var(--text2);margin-top:2px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--gray2);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray3)}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:13px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--gray2);display:flex;justify-content:flex-end;gap:8px}
.empty{text-align:center;padding:48px 24px;color:var(--gray3)}
.empty-icon{font-size:36px;margin-bottom:12px}
.empty-text{font-size:14px}
@media(max-width:640px){
  .header{padding:0 12px}.content{padding:12px}
  .card-body-grid{grid-template-columns:1fr}
  .card-stat:nth-child(n+3){display:none}
}
</style>
</head>

<div class="header">
  <div class="header-brand">KW <span>Legacy</span> Group</div>
  <div class="header-date" id="headerDate"></div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="toggleSearch()">🔍 Search</button>
    <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Student</button>
  </div>
</div>

<div class="summary" id="summaryBar"></div>
<div class="search-bar" id="searchBar" style="display:none">
  <input class="search-input" id="searchInput" placeholder="Search by name, phone, or email..." oninput="renderAll()"/>
</div>
<div class="tabs" id="tabBar"></div>
<div class="content" id="content"></div>

<!-- ADD STUDENT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add New Student</div>
      <button class="modal-close" onclick="closeAddModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><div class="field-label">Full Name *</div><input id="new-name" placeholder="First Last"/></div>
      <div class="field"><div class="field-label">Phone</div><input id="new-phone" placeholder="859.000.0000"/></div>
      <div class="field"><div class="field-label">Email</div><input id="new-email" placeholder="email@example.com"/></div>
      <div class="field"><div class="field-label">Start Date</div><input id="new-start" type="date"/></div>
      <div class="field"><div class="field-label">End Date (auto-fills 6 months)</div><input id="new-end" type="date"/></div>
      <div class="field">
        <div class="field-label">Referred By (KWLG Agent)</div>
        <div class="autocomplete-wrap">
          <input id="new-ref" placeholder="Start typing agent name..." autocomplete="off" oninput="acFilter('new-ref','new-ref-list','new-ref-val')"/>
          <div class="autocomplete-list" id="new-ref-list"></div>
          <input type="hidden" id="new-ref-val"/>
        </div>
      </div>
      <div class="field"><div class="field-label">Initial Note</div><textarea id="new-note" placeholder="e.g. 7/29 Introduced myself via text." rows="3"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewStudent()">Add Student</button>
    </div>
  </div>
</div>

}

}

// ── DATE UTILS ────────────────────────────────────────────────────────────────
function parseDate(str) {
  if (!str||!str.trim()) return null;
  const s = str.trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3],+m[1]-1,+m[2]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
function today() { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function daysLeft(e) { const d=parseDate(e); return d?Math.round((d-today())/86400000):null; }
function daysSince(l) { const d=parseDate(l); return d?Math.round((today()-d)/86400000):null; }
function fromInput(s) {
  if(!s) return '';
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?`${m[2]}/${m[3]}/${m[1]}`:s;
}
function toInput(s) {
  const d=parseDate(s); if(!d) return '';
  return d.toISOString().split('T')[0];
}

function calcStatus(s) {
  const dl=daysLeft(s.end), dsl=daysSince(s.lastLogin);
  if(dl===null) return 'UNKNOWN';
  if(dl<0) return 'EXPIRED';
  if(dl<=30) return 'DEADLINE';
  if(!s.lastLogin||!s.lastLogin.trim()) return 'NEVER';
  if(dsl>=14) return 'GONE';
  if(dsl>=7) return 'CHECK';
  return 'ON';
}
function dayGroup(s) {
  const dl=daysLeft(s.end);
  if(dl===null) return 'fri';
  if(dl<=30) return 'mon';
  if(dl<=60) return 'wed';
  return 'fri';
}

// ── AUTOCOMPLETE ──────────────────────────────────────────────────────────────
function acFilter(inputId, listId, valId) {
  const q = document.getElementById(inputId).value.toLowerCase().trim();
  const list = document.getElementById(listId);
  document.getElementById(valId).value = '';
  if (!q) { list.classList.remove('open'); return; }
  const matches = AGENTS.filter(a => a.name.toLowerCase().includes(q)).slice(0,8);
  if (!matches.length) { list.classList.remove('open'); return; }
  list.innerHTML = matches.map(a => `
    <div class="autocomplete-item" onclick="acSelect('${inputId}','${listId}','${valId}','${a.name}','${a.email}')">
      <div>${a.name}</div>
      <div class="ac-email">${a.email}</div>
    </div>`).join('');
  list.classList.add('open');
}
function acSelect(inputId, listId, valId, name, email) {
  document.getElementById(inputId).value = name;
  document.getElementById(valId).value = name;
  document.getElementById(listId).classList.remove('open');
}
document.addEventListener('click', e => {
  document.querySelectorAll('.autocomplete-list').forEach(l => {
    if (!l.contains(e.target)) l.classList.remove('open');
  });
});

    {l:'Never Logged In',k:'NEVER',col:'#4a148c'},
  ];
  document.getElementById('summaryBar').innerHTML = items.map((it,i) => `
    ${i?'<div class="summary-divider"></div>':''}
    <div class="summary-card">
      <div class="summary-dot" style="background:${it.col}"></div>
      <div class="summary-label">${it.l}</div>
      <div class="summary-num">${c[it.k]||0}</div>
    </div>`).join('');
}

function getQ() { const el=document.getElementById('searchInput'); return el?el.value.toLowerCase():''; }
function matchQ(s,q) { return !q||s.name.toLowerCase().includes(q)||(s.phone||'').includes(q)||(s.email||'').toLowerCase().includes(q); }

function renderTabs() {
  const q=getQ(), grp={mon:0,wed:0,fri:0};
  students.filter(s=>matchQ(s,q)).forEach(s=>{grp[dayGroup(s)]++;});
  const refCount = [...new Set(students.filter(s=>s.referredBy&&s.referredBy.trim()).map(s=>s.referredBy.trim()))].length;
  const tabs=[
    {id:'mon',l:'Monday',cls:'mon',count:grp.mon},
    {id:'wed',l:'Wednesday',cls:'wed',count:grp.wed},
    {id:'fri',l:'Friday',cls:'fri',count:grp.fri},
    {id:'all',l:'All Students',cls:'all',count:grp.mon+grp.wed+grp.fri},
    {id:'ref',l:'Referrals',cls:'ref',count:refCount},
  ];
  document.getElementById('tabBar').innerHTML = tabs.map(t=>`
    <div class="tab ${t.cls} ${activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${t.l}<span class="tab-count">${t.count}</span>
    </div>`).join('');
}

function setTab(id) { activeTab=id; renderAll(); }

function renderContent() {
  if (activeTab==='ref') { renderReferrals(); return; }
  const q=getQ();
  const filtered=students.filter(s=>matchQ(s,q));
  const sections = activeTab==='all'
    ? [{id:'mon',l:'MONDAY',sub:'Expired + 30 days or fewer remaining',cls:'mon'},
       {id:'wed',l:'WEDNESDAY',sub:'31 to 60 days remaining',cls:'wed'},
       {id:'fri',l:'FRIDAY',sub:'61+ days remaining · Add new students here',cls:'fri'}]
    : [{id:activeTab,
        l:activeTab==='mon'?'MONDAY':activeTab==='wed'?'WEDNESDAY':'FRIDAY',
        sub:activeTab==='mon'?'Expired + 30 days or fewer remaining':
            activeTab==='wed'?'31 to 60 days remaining':
            '61+ days remaining · Add new students here',
        cls:activeTab}];

  let html='';
  sections.forEach(sec=>{
    const gs=filtered.filter(s=>dayGroup(s)===sec.id)
      .sort((a,b)=>STATUS_ORDER.indexOf(calcStatus(a))-STATUS_ORDER.indexOf(calcStatus(b)));
    if(!gs.length&&activeTab!=='all'){html+=`<div class="empty"><div class="empty-icon">✓</div><div class="empty-text">No students in this group right now.</div></div>`;return;}
    if(!gs.length) return;
    html+=`<div class="section-label ${sec.cls}"><strong>${sec.l}</strong><span class="section-count">— ${sec.sub} · ${gs.length} student${gs.length!==1?'s':''}</span></div><div class="cards">${gs.map(s=>renderCard(s,sec.cls)).join('')}</div>`;
  });
  document.getElementById('content').innerHTML = html||`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No students match your search.</div></div>`;
}

function renderCard(s,grpCls) {
  const idx=students.indexOf(s), st=calcStatus(s);
  const dl=daysLeft(s.end), dsl=daysSince(s.lastLogin);
  return `<div class="card" id="card-${idx}">
    <div class="card-header" onclick="toggleCard(${idx})">
      <div class="card-accent ${grpCls}"></div>
      <div class="card-main">
        <div style="min-width:0;flex:1">
          <div class="card-name">${s.name}</div>
          <div class="card-phone">${s.phone||'No phone'}</div>
          ${s.referredBy?`<div class="card-ref-badge">👤 ${s.referredBy}</div>`:''}
        </div>
        <div class="card-meta">
          <div class="card-stat">
            <div class="card-stat-num ${dl!==null&&dl<=30?'warn':''}">${dl===null?'—':dl<0?Math.abs(dl)+' over':dl}</div>
            <div class="card-stat-label">${dl!==null&&dl<0?'Days Over':'Days Left'}</div>
          </div>
          <div class="card-stat">
            <div class="card-stat-num ${dsl!==null&&dsl>=14?'warn':''}">${dsl===null?'Never':dsl}</div>
            <div class="card-stat-label">Days Since Login</div>
          </div>
          <div class="card-stat">
            <div class="card-stat-num">${s.seatHrs||0}</div>
            <div class="card-stat-label">Seat Hrs</div>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <span class="status-badge ${STATUS_CLS[st]}">${STATUS_LABEL[st]}</span>
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-body-grid">
        <div class="field-group">
          <div class="field"><div class="field-label">Phone</div><input id="f-${idx}-phone" value="${s.phone||''}"/></div>
          <div class="field"><div class="field-label">Email</div><input id="f-${idx}-email" value="${s.email||''}"/></div>
          <div class="field"><div class="field-label">Last Login (from Kaplan)</div><input id="f-${idx}-login" type="date" value="${toInput(s.lastLogin)}"/></div>
          <div class="field"><div class="field-label">Seat Hours (from Kaplan)</div><input id="f-${idx}-seat" type="number" step="0.1" value="${s.seatHrs||0}"/></div>
          <div class="field"><div class="field-label">Start Date</div><input id="f-${idx}-start" type="date" value="${toInput(s.start)}"/></div>
          <div class="field"><div class="field-label">End Date</div><input id="f-${idx}-end" type="date" value="${toInput(s.end)}"/></div>
          <div class="field">
            <div class="field-label">Referred By (KWLG Agent)</div>
            <div class="autocomplete-wrap">
              <input id="f-${idx}-ref" value="${s.referredBy||''}" autocomplete="off" placeholder="Start typing agent name..." oninput="acFilter('f-${idx}-ref','f-${idx}-ref-list','f-${idx}-ref-val')"/>
              <div class="autocomplete-list" id="f-${idx}-ref-list"></div>
              <input type="hidden" id="f-${idx}-ref-val" value="${s.referredBy||''}"/>
            </div>
          </div>
        </div>
        <div class="field-group">
          <div class="field">
            <div class="field-label">Notes (newest at top)</div>
            <textarea id="f-${idx}-notes" rows="10">${s.notes||''}</textarea>
            <div class="notes-hint">Format: 7/29 Called, she said she's on chapter 4 and feeling good.</div>
          </div>
        </div>
      </div>
      <div class="save-row">
        <div class="save-confirm" id="confirm-${idx}">✓ Saved</div>
        <button class="btn btn-ghost btn-sm" onclick="toggleCard(${idx})">Close</button>
        <button class="btn btn-primary btn-sm" onclick="saveCard(${idx})">Save Changes</button>
      </div>
    </div>
  </div>`;
}

function toggleCard(idx) { document.getElementById(`card-${idx}`).classList.toggle('open'); }

function saveCard(idx) {
  const g = id => document.getElementById(id);
  const refInput = g(`f-${idx}-ref`).value.trim();
  const refVal   = g(`f-${idx}-ref-val`).value.trim();
  students[idx].phone      = g(`f-${idx}-phone`).value.trim();
  students[idx].email      = g(`f-${idx}-email`).value.trim();
  students[idx].lastLogin  = fromInput(g(`f-${idx}-login`).value);
  students[idx].seatHrs    = parseFloat(g(`f-${idx}-seat`).value)||0;
  students[idx].start      = fromInput(g(`f-${idx}-start`).value);
  students[idx].end        = fromInput(g(`f-${idx}-end`).value);
  students[idx].referredBy = refVal||refInput;
  students[idx].notes      = g(`f-${idx}-notes`).value;
  saveStudents(students);
  const c=document.getElementById(`confirm-${idx}`);
  c.classList.add('show'); setTimeout(()=>c.classList.remove('show'),2000);
  renderSummary(); renderTabs();
}

// ── REFERRALS TAB ─────────────────────────────────────────────────────────────
function renderReferrals() {
  const referred = students.filter(s=>s.referredBy&&s.referredBy.trim());
  if (!referred.length) {
    document.getElementById('content').innerHTML=`<div class="empty"><div class="empty-icon">👤</div><div class="empty-text">No referrals recorded yet. Add a student and select who referred them.</div></div>`;
    return;
  }
  // Group by sponsor
  const byAgent={};
  referred.forEach(s=>{
    const key=s.referredBy.trim();
    if(!byAgent[key]) byAgent[key]={name:key,students:[]};
    byAgent[key].students.push(s);
  });
  const sorted=Object.values(byAgent).sort((a,b)=>b.students.length-a.students.length);
  const agentInfo=name=>AGENTS.find(a=>a.name.toLowerCase()===name.toLowerCase())||{};

  let html=`<div class="section-label" style="color:#6a1b9a;background:#f3e5f5;border:1px solid #ce93d8;margin-bottom:16px">
    <strong>REFERRAL DASHBOARD</strong>
    <span class="section-count">— ${sorted.length} sponsoring agent${sorted.length!==1?'s':''} · ${referred.length} total referral${referred.length!==1?'s':''}</span>
  </div><div class="ref-section">`;

  sorted.forEach((ag,ai)=>{
    const info=agentInfo(ag.name);
    const stuHtml=ag.students.map(s=>{
      const st=calcStatus(s), dl=daysLeft(s.end), dsl=daysSince(s.lastLogin);
      return `<div class="ref-student-row">
        <div>
          <div class="ref-student-name">${s.name}</div>
          <div class="ref-student-meta">${s.phone||'No phone'} · End: ${s.end||'—'} · Seat Hrs: ${s.seatHrs||0}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <div style="text-align:right">
            <div style="font-size:12px;color:var(--text2)">${dl!==null?Math.abs(dl)+(dl<0?' days over':' days left'):'No end date'}</div>
            <div style="font-size:11px;color:var(--gray3)">${dsl!==null?dsl+' days since login':'Never logged in'}</div>
          </div>
          <span class="status-badge ${STATUS_CLS[st]}">${STATUS_LABEL[st]}</span>
        </div>
      </div>`;
    }).join('');

    html+=`<div class="ref-agent-card" id="ref-${ai}">
      <div class="ref-agent-header" onclick="toggleRef(${ai})">
        <div>
          <div class="ref-agent-name">${ag.name}</div>
          ${info.email?`<div class="ref-agent-email">${info.email}</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="ref-agent-count">${ag.students.length} referral${ag.students.length!==1?'s':''}</span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="ref-agent-body">${stuHtml}</div>
    </div>`;
  });

  html+=`</div>`;
  document.getElementById('content').innerHTML=html;
}

function toggleRef(ai) { document.getElementById(`ref-${ai}`).classList.toggle('open'); }

// ── ADD STUDENT ───────────────────────────────────────────────────────────────
function openAddModal() { document.getElementById('addModal').classList.add('open'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

document.getElementById('new-start').addEventListener('change',function(){
  if(!this.value) return;
  const d=new Date(this.value+'T00:00:00'); d.setMonth(d.getMonth()+6);
  document.getElementById('new-end').value=d.toISOString().split('T')[0];
});

function saveNewStudent() {
  const name=document.getElementById('new-name').value.trim();
  if(!name){alert('Please enter a name.');return;}
  const refInput=document.getElementById('new-ref').value.trim();
  const refVal=document.getElementById('new-ref-val').value.trim();
  students.push({
    name, phone:document.getElementById('new-phone').value.trim(),
    email:document.getElementById('new-email').value.trim(),
    start:fromInput(document.getElementById('new-start').value),
    end:fromInput(document.getElementById('new-end').value),
    lastLogin:'', seatHrs:0,
    referredBy:refVal||refInput,
    notes:document.getElementById('new-note').value.trim(),
  });
  saveStudents(students);
  closeAddModal();
  ['new-name','new-phone','new-email','new-start','new-end','new-ref','new-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('new-ref-val').value='';
  activeTab='fri'; renderAll();
}

function toggleSearch() {
  searchOpen=!searchOpen;
  const bar=document.getElementById('searchBar');
  bar.style.display=searchOpen?'block':'none';
  if(searchOpen) document.getElementById('searchInput').focus();
  else { document.getElementById('searchInput').value=''; renderAll(); }
}

document.getElementById('headerDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
renderAll();
</script>
